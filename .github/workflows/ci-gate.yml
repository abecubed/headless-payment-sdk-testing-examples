name: Payment SDK & Middleware Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    name: Typecheck, PCI Hygiene & Scenario Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 26 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Static PCI Guardrail (Block Hardcoded PANs in Specs)
        run: |
          if grep -rnE '\b[0-9]{13,16}\b' tests/*.spec.ts; then
            echo "ERROR: Raw card numbers detected in test specs. Import from paymentFixtures.ts instead."
            exit 1
          fi

      - name: Run AGENTS.md Architectural Linter & Quality Governance
        run: npm run test:governance

      - name: Run TypeScript Typecheck & Playwright Suite
        run: npm run typecheck && npx playwright test --reporter=list

      - name: Run Autonomous Payment Exploration Agent
        run: npm run agent:explore